<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>my index page</title>
</head>
</html>
<style>
    .header{
        grid-area:header;
        Background:rgb(33, 89, 37);
        box-shadow: 0px 10px 5px
    }
    .paragraph{
        grid-area:header;
        Background:rgb(205, 139, 39);
        box-shadow: 0px 10px 5px
    }
    .footer{
        grid-area:header;
        Background:rgb(179, 74, 64);
        box-shadow: 0px 10px 5px
    }
    .content{
        grid-area:header;
        Background:rgb(60, 92, 156);
        box-shadow: 0px 3px
    }
.container {  display: grid;
  grid-template-columns: 0.6fr 1.4fr;
  grid-template-rows: 10.9fr 10fr 10fr;
  grid-auto-columns: 1fr;
  grid-auto-rows: 300px;
  gap: 1px 1px;
  grid-auto-flow: row;
  align-content: start;
  grid-template-areas:
    "header header"
    "paragraph content"
    "footer footer";
}

.paragraph { grid-area: paragraph; }

.header { grid-area: header; }

.footer { grid-area: footer; }

.content { grid-area: content; }

</style>            
<body>
    <div class="container">
        <div class="paragraph">
            <h2>Side notes</h2>
        </div>
        <div class="header">
            <h1>This is the header</h1>
        </div>
        <div class="footer">
            <h1>Footer</h1>
        </div>
        
        <div class="content">
            <h2>Content</h2>
        </div>
      </div>
</body>
</html>
