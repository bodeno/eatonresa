<!doctype html>

<html lang="en">

<head>

      
 <style>
  #one {
    width:100px;
    Height:100px;
    background: green;
    border:3px solid red;
    transition: background 1s, transform 1s;
  }  
  #one:hover{
    background: blue;
    border:3px solid green;
    transform:rotate(180deg);
  }
  #two {
    width:100px;
    Height:100px;
    background: rgb(16, 152, 132);
    border:3px solid rgb(169, 47, 83);
    transition: background 00.1s, transform 00.1s;
  }  
  #two:hover{
    background: rgb(54, 54, 53);
    border:3px solid rgb(118, 128, 233);
    transform:rotate(44000deg);
  }   
  #three {
    width:100px;
    Height:100px;
    background: rgb(176, 106, 31);
    border:3px solid rgb(11, 12, 12);
    transition: background 3s, transform 3s;
  }  
  #three:hover{
    background: rgb(138, 214, 23);
    border:3px solid rgb(238, 141, 5);
    transform:rotate(380deg);
  }   
  #four {
    width:100px;
    Height:100px;
    background: rgb(219, 39, 201);
    border:3px solid rgb(211, 152, 152);
    transition: background 1.2s, transform 0.6s;
  }  
  #four:hover{
    background: rgb(196, 207, 193);
    border:3px solid orange;
    transform:rotate(410deg);
  } 
  body{
  background-image: linear-gradient(16456780deg, grey, rgb(199, 96, 96), rgb(228, 209, 186), rgb(175, 126, 126))} 
 </style>

</head>

<body>

<div id="one"></div>
<div id="two"></div>
<div id="three"></div>
<div id="four"></div>
</body>

</html>
