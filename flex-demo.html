<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Boden's Flexbox Demo</title>
    <style>
        body {
            background-color: #eeeeee85;
            color: #202020;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            max-width: 80%;
            margin: 0 auto;
        }

        #one {
            background-color: #cd3726;
            border: 2px solid #16a4f1;
            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;
            display: flex;
            flex-direction: row-reverse;
           justify-content: flex-end;
            align-items: flex-end;
        }

        #one div {
            text-align: center;
            background-color: #e0ef0c;
            border: 2px solid #65ec8044;
            border-radius: 29px;
            flex-grow: 1;
        }

        #two {
            background-color: #9c2ab8;
            border: 2px solid #d33939;
            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /align-items: baseline;
        }

        #two div {
            text-align: center;
            background-color: #2ca566;
            border: 2px solid #4444;
            border-radius: 10px;
            flex-grow: 1;
        }

        #three {
            background-color: #e46c10;
            border: 2px solid #444;
            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;
            display: flex;
            flex-direction: row;
          justify-content: center;
            align-items: stretch;
        }

        #three div {
            text-align: center;
            background-color: #4e81b6;
            border: 2px solid #4444;
            border-radius: 10px;
            flex-grow: 1;
        }
    </style>
</head>

<body>
    <h2>Boden's Flexbox Demo setup</h2>
    <div id="one">
        <div>
            <p>one</p>
        </div>
        <div>
            <p>two</p>
        </div>
        <div>
            <p>three<br>has more text</p>
        </div>
    </div>

    <div id="two">
        <div>
            <p>one</p>
        </div>
        <div>
            <p>two</p>
        </div>
        <div>
            <p>three<br>has more text</p>
        </div>
    </div>

    <div id="three">
        <div>
            <p>one</p>
        </div>
        <div>
            <p>two</p>
        </div>
        <div>
            <p>three<br>has more text</p>
        </div>
    </div>
</body>

</html>
